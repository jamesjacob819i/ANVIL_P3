<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #404060;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1em;
        }
        
        .status-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        
        .status-card h3 {
            color: #00d4ff;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .status-value {
            font-size: 2em;
            font-weight: bold;
            color: #fff;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .incidents-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        
        .incident-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .incident-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.1);
        }
        
        .incident-card.active {
            background: rgba(0, 212, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.8);
        }
        
        .incident-id {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: #00d4ff;
            margin-bottom: 10px;
            word-break: break-all;
        }
        
        .incident-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .status-new {
            background: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }
        
        .status-in_progress {
            background: rgba(255, 193, 7, 0.3);
            color: #ffc107;
            border: 1px solid #ffc107;
        }
        
        .status-resolved {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
            border: 1px solid #4caf50;
        }
        
        .incident-time {
            font-size: 0.85em;
            color: #888;
            margin-top: 10px;
        }
        
        .incident-details {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 212, 255, 0.1);
            display: none;
        }
        
        .incident-card.active .incident-details {
            display: block;
        }
        
        .detail-row {
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .detail-label {
            color: #00d4ff;
            font-weight: bold;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }
        
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.5);
            color: #ff6b6b;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        
        .refresh-icon {
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 5px;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.2);
            color: #666;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚡ Sentinel Dashboard</h1>
            <p class="subtitle">Autonomous Production Incident Commander</p>
        </header>
        
        <div class="status-bar">
            <div class="status-card">
                <h3>Total Incidents</h3>
                <div class="status-value" id="total-incidents">0</div>
            </div>
            <div class="status-card">
                <h3>Active</h3>
                <div class="status-value" id="active-incidents">0</div>
            </div>
            <div class="status-card">
                <h3>Resolved</h3>
                <div class="status-value" id="resolved-incidents">0</div>
            </div>
            <div class="status-card">
                <h3>API Status</h3>
                <div class="status-value" id="api-status">
                    <span style="color: #4caf50;">✓</span>
                </div>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="refreshIncidents()">🔄 Refresh</button>
            <button onclick="filterStatus('all')">All Incidents</button>
            <button onclick="filterStatus('new')">New</button>
            <button onclick="filterStatus('in_progress')">In Progress</button>
            <button onclick="filterStatus('resolved')">Resolved</button>
            <button onclick="triggerTestIncident()">🎯 Trigger Test Incident</button>
        </div>
        
        <div id="error-container"></div>
        
        <div id="incidents-list" class="incidents-container">
            <div class="loading">Loading incidents...</div>
        </div>
        
        <div class="footer">
            <p>🚀 Sentinel v1.0 | Real-time incident management system</p>
            <p>Dashboard API: <code>http://localhost:8001</code> | Webhook Ingress: <code>http://localhost:8000</code></p>
        </div>
    </div>
    
    <script>
        const API_URL = 'http://localhost:8001';
        let currentFilter = 'all';
        let allIncidents = [];
        
        async function fetchIncidents() {
            try {
                const response = await fetch(`${API_URL}/api/incidents?limit=100`);
                if (!response.ok) throw new Error('Failed to fetch incidents');
                allIncidents = await response.json();
                renderIncidents();
                updateStats();
                clearError();
            } catch (error) {
                showError('Failed to load incidents: ' + error.message);
                console.error(error);
            }
        }
        
        function renderIncidents() {
            const container = document.getElementById('incidents-list');
            
            let filtered = allIncidents;
            if (currentFilter !== 'all') {
                filtered = allIncidents.filter(inc => inc.status === currentFilter);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="loading">No incidents found</div>';
                return;
            }
            
            container.innerHTML = filtered.map(incident => `
                <div class="incident-card" onclick="toggleDetail(this)">
                    <div class="incident-id">ID: ${incident.id}</div>
                    <div class="incident-status status-${incident.status}">
                        ${incident.status.replace('_', ' ')}
                    </div>
                    <div class="incident-time">
                        Created: ${new Date(incident.created_at).toLocaleString()}
                    </div>
                    <div class="incident-details">
                        <div class="detail-row">
                            <span class="detail-label">Service:</span>
                            ${incident.alert_payload?.service || 'N/A'}
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Message:</span>
                            ${incident.alert_payload?.message || 'N/A'}
                        </div>
                        ${incident.resolved_at ? `
                            <div class="detail-row">
                                <span class="detail-label">Resolved:</span>
                                ${new Date(incident.resolved_at).toLocaleString()}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function toggleDetail(element) {
            document.querySelectorAll('.incident-card').forEach(card => {
                if (card !== element) card.classList.remove('active');
            });
            element.classList.toggle('active');
        }
        
        function updateStats() {
            document.getElementById('total-incidents').textContent = allIncidents.length;
            document.getElementById('active-incidents').textContent = 
                allIncidents.filter(i => i.status === 'in_progress').length;
            document.getElementById('resolved-incidents').textContent = 
                allIncidents.filter(i => i.status === 'resolved').length;
        }
        
        function filterStatus(status) {
            currentFilter = status;
            renderIncidents();
        }
        
        function refreshIncidents() {
            document.querySelector('button').innerHTML = '<span class="refresh-icon">⟳</span>Refresh';
            fetchIncidents();
            setTimeout(() => {
                document.querySelector('button').innerHTML = '🔄 Refresh';
            }, 500);
        }
        
        async function triggerTestIncident() {
            try {
                const response = await fetch(`${API_URL}/api/incidents`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        service: 'demo-service',
                        message: 'Test incident triggered from dashboard',
                        severity: 'high'
                    })
                });
                
                if (!response.ok) {
                    showError('Test incident API not available. Use: ./demo/seed_incident.sh');
                    return;
                }
                
                await new Promise(r => setTimeout(r, 1000));
                fetchIncidents();
            } catch (error) {
                showError('Could not trigger test incident. Try running: ./demo/seed_incident.sh');
            }
        }
        
        function showError(message) {
            const container = document.getElementById('error-container');
            container.innerHTML = `<div class="error">⚠️ ${message}</div>`;
        }
        
        function clearError() {
            document.getElementById('error-container').innerHTML = '';
        }
        
        // Auto-refresh every 5 seconds
        setInterval(fetchIncidents, 5000);
        
        // Initial load
        fetchIncidents();
    </script>
</body>
</html>
